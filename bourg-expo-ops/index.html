  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
(() => {
  'use strict';
  const KEY = 'bourg-expo-ops-v1';
  const TODAY_SCOPE_KEY = 'cp-bourg-today-scope-v1';
  const EVENT_DAYS = [

  const baseState = {

    hotel:{name:'Holiday Inn Express Las Vegas – Stadium Area',address:'5760 Polaris Ave, Las Vegas, NV 89118'},
    booths:[
      {id:'bourg',name:'C.P. Bourg',code:'N7335',equipmentStatus:'Ready'},

    ],
    people:[
      {id:'charles',name:'Charles Bourg',title:'CEO',group:'Sales',status:'Available',location:'C.P. Bourg'},
      {id:'jim',name:'Jim Tressler',title:'Senior VP, USA',group:'Sales',status:'Available',location:'Canon'},
      {id:'dan',name:'Dan Attew',title:'Sales Director, EMEA & APAC',group:'Sales',status:'Available',location:'Xerox'},
      {id:'sean',name:'Sean Edmonds',title:'Regional Sales Manager',group:'Sales',status:'Available',location:'C.P. Bourg'},
      {id:'chuck',name:'Chuck Cartier',title:'Manager - NTS',group:'Technical',status:'Available',location:'C.P. Bourg'},

      {id:'james',name:'Jayme Varao',title:'NTS',group:'Technical',status:'Available',location:'C.P. Bourg'},
      {id:'luis',name:'Luis Fernandez',title:'NTS',group:'Technical',status:'Available',location:'Canon'},
      {id:'shadrach',name:'Shadrach Santiago',title:'NTS',group:'Technical',status:'Available',location:'Canon'}
    ],
    assignments:{
      wed:[
        {id:'w1',start:'08:00',end:'09:00',personId:'sean',location:'C.P. Bourg',activity:'Booth prep'},
        {id:'w2',start:'09:00',end:'11:00',personId:'sean',location:'C.P. Bourg',activity:'Manning booth'},

        {id:'wj3',start:'14:00',end:'17:00',personId:'jim',location:'C.P. Bourg',activity:'Booth coverage'},
        {id:'wc1',start:'08:00',end:'12:00',personId:'charles',location:'C.P. Bourg',activity:'Booth coverage'},
        {id:'wc2',start:'12:00',end:'15:00',personId:'charles',location:'Canon',activity:'Partner meetings'},
        {id:'wc3',start:'15:00',end:'17:00',personId:'charles',location:'C.P. Bourg',activity:'Booth coverage'},
        {id:'wd1',start:'08:00',end:'12:00',personId:'dan',location:'Xerox',activity:'Booth coverage'},
        {id:'wd2',start:'12:00',end:'14:00',personId:'dan',location:'Customer Meeting',activity:'Customer meetings'},
        {id:'wd3',start:'14:00',end:'17:00',personId:'dan',location:'Xerox',activity:'Booth coverage'}
      ],
      setup:[],thu:[],fri:[],teardown:[]
    },
    issues:[],
    rides:[{id:'r1',day:'wed',time:'07:45',from:'Hotel',to:'LVCC',note:'Morning team rideshare',joined:['sean']}],
    appointments:[],
    coverageRequests:[],
    reminderMinutes:10,
    techTasks:[
      {id:'ts1',day:'setup',booth:'C.P. Bourg',task:'Position and connect equipment',assignedTo:'',done:false},
      {id:'ts2',day:'setup',booth:'C.P. Bourg',task:'Run test jobs and verify finishing',assignedTo:'',done:false},
      {id:'ts3',day:'setup',booth:'Canon',task:'Position and connect C.P. Bourg equipment',assignedTo:'',done:false},
      {id:'ts4',day:'setup',booth:'Canon',task:'Run integrated press-to-finishing test',assignedTo:'',done:false},
      {id:'ts5',day:'setup',booth:'Xerox',task:'Position and connect C.P. Bourg equipment',assignedTo:'',done:false},
      {id:'ts6',day:'setup',booth:'Xerox',task:'Run integrated press-to-finishing test',assignedTo:'',done:false},
      {id:'tt1',day:'teardown',booth:'C.P. Bourg',task:'Disconnect, inventory and photograph equipment',assignedTo:'',done:false},
      {id:'tt2',day:'teardown',booth:'Canon',task:'Disconnect, inventory and photograph equipment',assignedTo:'',done:false},
      {id:'tt3',day:'teardown',booth:'Xerox',task:'Disconnect, inventory and photograph equipment',assignedTo:'',done:false},
      {id:'tt4',day:'teardown',booth:'C.P. Bourg',task:'Confirm crates, labels and freight pickup',assignedTo:'',done:false},
      {id:'tt5',day:'teardown',booth:'Canon',task:'Confirm crates, labels and freight pickup',assignedTo:'',done:false},
      {id:'tt6',day:'teardown',booth:'Xerox',task:'Confirm crates, labels and freight pickup',assignedTo:'',done:false}
    ]
  };
  let state = normalizeState(loadState());
  const main = document.getElementById('mainContent');
  const modal = document.getElementById('modal');
  const modalBody = document.getElementById('modalBody');
  const modalTitle = document.getElementById('modalTitle');
  const modalActions = document.getElementById('modalActions');
  const toast = document.getElementById('toast');
  let installPrompt = null;

  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
  function normalizeState(s){
    const out={...clone(baseState),...(s||{})};
    out.assignments={...clone(baseState.assignments),...((s||{}).assignments||{})};
    for(const k of ['appointments','coverageRequests','techTasks','issues','rides','people','booths']) if(!Array.isArray(out[k])) out[k]=clone(baseState[k]||[]);
    const normalizeLocation=v=>v==='Bourg'?'C.P. Bourg':v;
    out.people.forEach(p=>{ p.location=normalizeLocation(p.location); if(p.id==='sean') p.name='Sean Edmonds'; if(p.id==='charles') p.title='CEO'; if(p.id==='chuck') p.title='Manager - NTS'; if(['tim','james','luis','shadrach'].includes(p.id)) p.title='NTS'; });
    const hierarchy={charles:1,jim:2,dan:3,sean:4,chuck:5,tim:6,james:7,luis:8,shadrach:9};
    out.people.sort((a,b)=>(hierarchy[a.id]??999)-(hierarchy[b.id]??999));
    out.booths.forEach(b=>{ if(b.id==='bourg') b.name='C.P. Bourg'; });
    Object.values(out.assignments).forEach(list=>(list||[]).forEach(a=>a.location=normalizeLocation(a.location)));
    out.appointments.forEach(a=>a.location=normalizeLocation(a.location));
    out.coverageRequests.forEach(r=>r.booth=normalizeLocation(r.booth));
    out.techTasks.forEach(t=>t.booth=normalizeLocation(t.booth));
    out.issues.forEach(i=>i.booth=normalizeLocation(i.booth));
    if(!Number.isFinite(Number(out.reminderMinutes))) out.reminderMinutes=10;
    return out;
  }
  function loadState(){
    try { const s=JSON.parse(localStorage.getItem(KEY)); return s ? {...clone(baseState),...s} : clone(baseState); }
    catch { return clone(baseState); }
  }
  function save(){ localStorage.setItem(KEY,JSON.stringify(state)); updateIssueBadge(); window.dispatchEvent(new CustomEvent('bourgops:save',{detail:{state:clone(state)}})); }
  function esc(s=''){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function person(id){ return state.people.find(p=>p.id===id); }
  function boothByName(name){ const normalized=name==='Bourg'?'C.P. Bourg':name; return state.booths.find(b=>b.name===normalized || b.name.replace('C.P. ','')===name); }
  function fmtTime(t){ if(!t)return''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; const hh=((h+11)%12)+1; return `${hh}:${String(m).padStart(2,'0')} ${ap}`; }
  function initials(name){ return name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(); }
  function showToast(msg){ toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200); }
  function updateIssueBadge(){ const n=state.issues.filter(i=>i.status!=='Resolved').length; document.getElementById('issueBadge').textContent=`${n} open issue${n===1?'':'s'}`; }
  function dayStrip(){ return `<div class="day-strip">${EVENT_DAYS.map(d=>`<button class="day-chip ${state.selectedDay===d.id?'active':''}" data-day="${d.id}">${d.label}</button>`).join('')}</div>`; }
  function locationCode(loc){ const b=boothByName(loc); return b?b.code:''; }
  function statusClass(s){ if(s==='Ready')return'ready'; if(s==='Down')return'down'; if(s.includes('Service'))return'service'; return'neutral'; }

  const DAY_DATES={setup:'2026-09-22',wed:'2026-09-23',thu:'2026-09-24',fri:'2026-09-25',teardown:'2026-09-25'};
  function todayKey(){ const d=new Date(); const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); const iso=`${y}-${m}-${day}`; return Object.entries(DAY_DATES).find(([k,v])=>v===iso && k!=='teardown')?.[0]||null; }
  function nowHHMM(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  function currentAssignment(personId){
    const list=(state.assignments[state.selectedDay]||[]).filter(a=>a.personId===personId).sort((a,b)=>a.start.localeCompare(b.start));
    if(!list.length) return null;
    if(todayKey()===state.selectedDay){ const now=nowHHMM(); return list.find(a=>a.end>now) || list[list.length-1]; }
    return list[0];
  }
  function phaseInfo(){ if(state.selectedDay==='setup') return {label:'SETUP MODE',cls:'setup'}; if(state.selectedDay==='teardown') return {label:'TEARDOWN MODE',cls:'teardown'}; return {label:'SHOW MODE',cls:'show'}; }
  function dayAppointments(){ return state.appointments.filter(a=>a.day===state.selectedDay).sort((a,b)=>a.time.localeCompare(b.time)); }
  function assignmentAt(personId,time){ return (state.assignments[state.selectedDay]||[]).find(a=>a.personId===personId && a.start<=time && a.end>time); }
  function coverageSlots(){ const end=state.selectedDay==='fri'?'15:00':'17:00'; const starts=['09:00','11:00','13:00','15:00'].filter(t=>t<end); return starts.map(t=>({time:t,booths:state.booths.map(b=>{const loc=b.name; const sales=state.people.filter(p=>p.group==='Sales').filter(p=>assignmentAt(p.id,t)?.location===loc); return {id:b.id,name:b.name,code:b.code,sales};})})); }
  function plannedCoverageGaps(){ if(!['wed','thu','fri'].includes(state.selectedDay)) return []; return coverageSlots().flatMap(slot=>slot.booths.filter(b=>!b.sales.length).map(b=>({time:slot.time,booth:b}))); }
  function todayScope(){ const v=localStorage.getItem(TODAY_SCOPE_KEY); return ['mine','group','team'].includes(v)?v:'mine'; }
  function groupNameFor(p){ return p?.group==='Technical'?'NTS':'Sales'; }
  function dayAssignmentsFor(personId){ return (state.assignments[state.selectedDay]||[]).filter(a=>a.personId===personId).sort((a,b)=>a.start.localeCompare(b.start)); }
  function assignmentSummary(p){
    const a=currentAssignment(p.id);
    if(!a) return {main:'No assignment',sub:p.status||'Available'};
    return {main:`${a.location}${locationCode(a.location)?' • '+locationCode(a.location):''}`,sub:`${fmtTime(a.start)}–${fmtTime(a.end)} • ${a.activity}`};
  }
  function todayScopeTabs(me,scope){
    const groupLabel=groupNameFor(me);
    return `<div class="today-scope">
      <button class="today-scope-btn ${scope==='mine'?'active':''}" data-today-scope="mine">Mine</button>
      <button class="today-scope-btn ${scope==='group'?'active':''}" data-today-scope="group">My Group • ${esc(groupLabel)}</button>
      <button class="today-scope-btn ${scope==='team'?'active':''}" data-today-scope="team">Team</button>
    </div>`;
  }
  function mineDashboard(me){
    const list=dayAssignmentsFor(me.id);
    const next=currentAssignment(me.id);
    const myAppts=dayAppointments().filter(a=>(a.ownerIds||[]).includes(me.id));
    const myRides=state.rides.filter(r=>r.day===state.selectedDay && (r.joined||[]).includes(me.id));
    const myIssues=state.issues.filter(i=>i.status!=='Resolved' && i.assignedTo===me.name);
    const myCoverage=state.coverageRequests.filter(r=>r.day===state.selectedDay && r.status!=='Resolved' && r.createdBy===me.id);
    return `<div class="card today-command">
      <div class="today-command-head"><div><div class="label">My Day</div><div class="today-command-title">${esc(me.name)}</div><div class="today-command-sub">${esc(me.title)} • ${esc(me.status)} • currently ${esc(me.location)}</div></div><span class="pill neutral">${esc(groupNameFor(me))}</span></div>
      <div class="today-next"><div class="label">Where should I be?</div><div class="today-next-main">${next?`${esc(next.location)} ${locationCode(next.location)?'• '+locationCode(next.location):''}`:'No assignment yet'}</div><div class="today-next-sub">${next?`${fmtTime(next.start)}–${fmtTime(next.end)} • ${esc(next.activity)}`:'No assignment has been added for this day.'}</div></div>
      <div class="today-stat-row"><div class="today-stat"><strong>${list.length}</strong><span>Assignments</span></div><div class="today-stat"><strong>${myAppts.length}</strong><span>Meetings</span></div><div class="today-stat"><strong>${myIssues.length+myCoverage.length}</strong><span>Needs attention</span></div></div>
      <div class="label" style="margin-top:13px">My schedule</div>
      <div class="today-schedule">${list.length?list.slice(0,5).map(a=>`<div class="today-schedule-row"><div class="when">${fmtTime(a.start)}</div><div><div class="what">${esc(a.location)} ${locationCode(a.location)?'• '+locationCode(a.location):''}</div><div class="why">${fmtTime(a.start)}–${fmtTime(a.end)} • ${esc(a.activity)}</div></div></div>`).join(''):'<div class="empty compact-empty">Nothing scheduled yet.</div>'}</div>
      <div class="today-attention">${myAppts.length?`<span>${myAppts.length} customer meeting${myAppts.length===1?'':'s'}</span>`:''}${myRides.length?`<span>${myRides.length} joined ride${myRides.length===1?'':'s'}</span>`:''}${myIssues.length?`<span class="hot">${myIssues.length} tech issue${myIssues.length===1?'':'s'}</span>`:''}${myCoverage.length?`<span class="hot">${myCoverage.length} coverage request${myCoverage.length===1?'':'s'}</span>`:''}${!myAppts.length&&!myRides.length&&!myIssues.length&&!myCoverage.length?'<span>Nothing else needs your attention right now.</span>':''}</div>
      <div class="actions"><button class="primary-btn" id="checkInBtn">I'm here</button><button class="ghost-btn" id="needCoverageBtn">Need coverage</button><button class="ghost-btn compact" id="reminderBtn">Reminders</button><button class="ghost-btn compact" data-jump-view="chat">Chat</button></div>
    </div>`;
  }
  function groupDashboard(me){
    const members=state.people.filter(p=>p.group===me.group);
    const ids=new Set(members.map(p=>p.id));
    const groupLabel=groupNameFor(me);
    const groupAppts=dayAppointments().filter(a=>(a.ownerIds||[]).some(id=>ids.has(id)));
    const openIssues=state.issues.filter(i=>i.status!=='Resolved' && (me.group==='Technical' ? (!i.assignedTo || members.some(p=>p.name===i.assignedTo)) : false));
    const openCoverage=state.coverageRequests.filter(r=>r.day===state.selectedDay && r.status!=='Resolved');
    const attention=me.group==='Technical'?openIssues.length:(openCoverage.length+plannedCoverageGaps().length);
    return `<div class="card today-command">
      <div class="today-command-head"><div><div class="label">My Group</div><div class="today-command-title">${esc(groupLabel)} at a glance</div><div class="today-command-sub">${members.length} people • personalized for ${esc(me.name)}</div></div><span class="pill neutral">${members.length} members</span></div>
      <div class="today-stat-row"><div class="today-stat"><strong>${members.filter(p=>p.status!=='Off Duty').length}</strong><span>Active</span></div><div class="today-stat"><strong>${groupAppts.length}</strong><span>${me.group==='Sales'?'Meetings':'Group meetings'}</span></div><div class="today-stat"><strong>${attention}</strong><span>Needs attention</span></div></div>
      <div class="label" style="margin-top:13px">Where everyone should be</div>
      <div class="scope-roster">${members.map(p=>{const s=assignmentSummary(p);return `<div class="scope-person"><div><strong>${esc(p.name)}</strong><div class="sub">${esc(p.status)} • currently ${esc(p.location)}</div></div><div class="loc">${esc(s.main)}<div class="sub">${esc(s.sub)}</div></div></div>`;}).join('')}</div>
      <div class="today-attention">${me.group==='Technical'?(openIssues.length?`<span class="hot">${openIssues.length} open NTS issue${openIssues.length===1?'':'s'}</span>`:'<span>No open NTS issues.</span>'):(openCoverage.length?`<span class="hot">${openCoverage.length} coverage request${openCoverage.length===1?'':'s'}</span>`:'')}${me.group==='Sales'&&plannedCoverageGaps().length?`<span class="hot">${plannedCoverageGaps().length} planned coverage gap${plannedCoverageGaps().length===1?'':'s'}</span>`:''}</div>
      <div class="actions"><button class="ghost-btn compact" data-jump-view="${me.group==='Technical'?'tech':'schedule'}">${me.group==='Technical'?'Open Tech Ops':'Open Schedule'}</button><button class="ghost-btn compact" data-jump-view="chat">Open Chat</button></div>
    </div>`;
  }
  function teamDashboard(me){
    const openIssues=state.issues.filter(i=>i.status!=='Resolved');
    const rides=state.rides.filter(r=>r.day===state.selectedDay);
    const gaps=plannedCoverageGaps();
    return `<div class="card today-command">
      <div class="today-command-head"><div><div class="label">Team</div><div class="today-command-title">C.P. Bourg team picture</div><div class="today-command-sub">All 9 people • all three partner locations</div></div><span class="pill neutral">${state.people.length} people</span></div>
      <div class="today-stat-row"><div class="today-stat"><strong>${state.people.filter(p=>p.status!=='Off Duty').length}</strong><span>Active</span></div><div class="today-stat"><strong>${openIssues.length}</strong><span>Open issues</span></div><div class="today-stat"><strong>${gaps.length}</strong><span>Coverage gaps</span></div></div>
      <div class="label" style="margin-top:13px">Current plan</div>
      <div class="scope-roster">${state.people.map(p=>{const s=assignmentSummary(p);return `<div class="scope-person"><div><strong>${esc(p.name)}</strong><div class="sub">${esc(groupNameFor(p))} • ${esc(p.status)}</div></div><div class="loc">${esc(s.main)}<div class="sub">${esc(s.sub)}</div></div></div>`;}).join('')}</div>
      <div class="today-attention">${rides.length?`<span>${rides.length} ride${rides.length===1?'':'s'} planned</span>`:''}${openIssues.length?`<span class="hot">${openIssues.length} open issue${openIssues.length===1?'':'s'}</span>`:''}${gaps.length?`<span class="hot">${gaps.length} coverage gap${gaps.length===1?'':'s'}</span>`:'<span>Sales coverage plan has no detected gaps.</span>'}</div>
      <div class="actions"><button class="ghost-btn compact" data-jump-view="schedule">Team Schedule</button><button class="ghost-btn compact" data-jump-view="team">Team Status</button><button class="ghost-btn compact" data-jump-view="chat">Team Chat</button></div>
    </div>`;
  }
  function renderToday(){

  function renderTeam(){

  function openModal(title,body,actions){ modalTitle.textContent=title;modalBody.innerHTML=body;modalActions.innerHTML=actions||'<button class="ghost-btn" value="cancel">Cancel</button>';modal.showModal(); }
  function closeModal(){ modal.close(); }
  function field(name,label,value='',type='text'){ return `<div class="field"><label for="${name}">${label}</label><input class="input" id="${name}" name="${name}" type="${type}" value="${esc(value)}"></div>`; }
  function selectField(name,label,opts,current){ return `<div class="field"><label for="${name}">${label}</label><select class="select" id="${name}" name="${name}">${opts.map(o=>`<option ${o===current?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`; }

  function appointmentCard(a){ const owners=(a.ownerIds||[]).map(id=>person(id)?.name).filter(Boolean); return `<button class="appointment-card" data-appt="${a.id}"><div class="appt-time">${fmtTime(a.time)}</div><div class="appt-main"><strong>${esc(a.company||'Customer appointment')}</strong><span>${esc(a.location||'TBD')}${owners.length?' • '+esc(owners.join(', ')):''}</span></div><span class="appt-arrow">›</span></button>`; }

  function openAppointment(id){ const a=id?state.appointments.find(x=>x.id===id):{id:'appt'+Date.now(),day:state.selectedDay,time:'10:00',duration:30,company:'',contact:'',location:'C.P. Bourg',ownerIds:[state.currentUserId],notes:''}; const ownerNames=(a.ownerIds||[]).map(id=>person(id)?.name).filter(Boolean); openModal(id?'Edit appointment':'Add appointment',`<div class="form-grid">${field('apCompany','Company / customer',a.company)}${field('apContact','Contact',a.contact)}${field('apTime','Time',a.time,'time')}${selectField('apLocation','Location',['C.P. Bourg','Canon','Xerox','Meeting Room','Off-site'],a.location)}${selectField('apOwner','Primary owner',state.people.filter(p=>p.group==='Sales').map(p=>p.name),ownerNames[0]||person(state.currentUserId)?.name)}<div class="field"><label for="apNotes">Notes</label><textarea id="apNotes" class="textarea">${esc(a.notes||'')}</textarea></div></div>`,`<button class="ghost-btn" value="cancel">Cancel</button>${id?'<button id="deleteAppointment" type="button" class="danger-btn">Delete</button>':''}<button id="saveAppointment" type="button" class="primary-btn">Save</button>`); document.getElementById('saveAppointment').onclick=()=>{a.day=state.selectedDay;a.company=document.getElementById('apCompany').value.trim()||'Customer appointment';a.contact=document.getElementById('apContact').value.trim();a.time=document.getElementById('apTime').value;a.location=document.getElementById('apLocation').value;const owner=state.people.find(p=>p.name===document.getElementById('apOwner').value);a.ownerIds=owner?[owner.id]:[];a.notes=document.getElementById('apNotes').value.trim();if(!id)state.appointments.push(a);save();closeModal();render();showToast('Appointment saved');}; if(id)document.getElementById('deleteAppointment').onclick=()=>{state.appointments=state.appointments.filter(x=>x.id!==id);save();closeModal();render();showToast('Appointment deleted');}; }

  function openCopyDay(){ const sources=EVENT_DAYS.filter(d=>d.id!==state.selectedDay).map(d=>d.label); openModal('Copy schedule',`<div class="form-grid">${selectField('copySource','Copy assignments from',sources,sources[0])}<div class="status-banner">This replaces assignments on ${esc(EVENT_DAYS.find(d=>d.id===state.selectedDay)?.label||'this day')} with a copy you can edit.</div></div>`,`<button class="ghost-btn" value="cancel">Cancel</button><button id="copyConfirm" type="button" class="primary-btn">Copy</button>`); document.getElementById('copyConfirm').onclick=()=>{const label=document.getElementById('copySource').value;const src=EVENT_DAYS.find(d=>d.label===label)?.id;if(!src)return;state.assignments[state.selectedDay]=(state.assignments[src]||[]).map(a=>({...a,id:'a'+Date.now()+Math.random().toString(36).slice(2,7)}));save();closeModal();render();showToast('Schedule copied');}; }

  function openAssignment(id){ const list=state.assignments[state.selectedDay]||[]; const a=id?list.find(x=>x.id===id):{id:'a'+Date.now(),start:'09:00',end:'10:00',personId:state.people[0]?.id,location:'C.P. Bourg',activity:'Booth coverage'};openModal(id?'Edit assignment':'Add assignment',`<div class="form-grid">${selectField('aPerson','Person',state.people.map(p=>p.name),person(a.personId)?.name)}${field('aStart','Start',a.start,'time')}${field('aEnd','End',a.end,'time')}${selectField('aLocation','Location',['C.P. Bourg','Canon','Xerox','Customer Meeting','Walking Floor','Break','Hotel','Off Duty'],a.location)}${field('aActivity','Activity',a.activity)}</div>`,`<button class="ghost-btn" value="cancel">Cancel</button>${id?'<button id="deleteAssignment" type="button" class="danger-btn">Delete</button>':''}<button id="saveAssignment" type="button" class="primary-btn">Save</button>`);document.getElementById('saveAssignment').onclick=()=>{const pname=document.getElementById('aPerson').value;a.personId=state.people.find(p=>p.name===pname)?.id||state.people[0].id;a.start=document.getElementById('aStart').value;a.end=document.getElementById('aEnd').value;a.location=document.getElementById('aLocation').value;a.activity=document.getElementById('aActivity').value.trim();if(!id){state.assignments[state.selectedDay]=state.assignments[state.selectedDay]||[];state.assignments[state.selectedDay].push(a);}save();closeModal();render();showToast('Assignment saved');};if(id)document.getElementById('deleteAssignment').onclick=()=>{state.assignments[state.selectedDay]=list.filter(x=>x.id!==id);save();closeModal();render();showToast('Assignment deleted');}; }

  function openBooth(id){ const b=state.booths.find(x=>x.id===id); const loc=b.name; const peopleHere=state.people.filter(p=>p.location===loc);openModal(`${b.name} • ${b.code}`,`<div class="form-grid">${selectField('bStatus','Equipment status',['Ready','Installing','Service needed','Down','Teardown'],b.equipmentStatus)}<div class="card flat"><div class="label">Currently checked in</div><div style="margin-top:8px" class="small">${peopleHere.length?peopleHere.map(p=>esc(p.name)).join(' • '):'Nobody checked in'}</div></div></div>`,`<button class="ghost-btn" value="cancel">Cancel</button><button id="saveBooth" type="button" class="primary-btn">Save</button>`);document.getElementById('saveBooth').onclick=()=>{b.equipmentStatus=document.getElementById('bStatus').value;save();closeModal();render();showToast(`${b.name} updated`);}; }

  function openTechStatus(id){ const p=person(id);openModal(p.name,`<div class="form-grid">${selectField('tLocation','Location',['C.P. Bourg','Canon','Xerox','Walking Floor','Hotel','Off-site'],p.location)}${selectField('tStatus','Status',['Available','Installing','Service Call','Preventive Check','Demo Support','Break','Teardown','Off Duty'],p.status)}</div>`,`<button class="ghost-btn" value="cancel">Cancel</button><button id="saveTech" type="button" class="primary-btn">Update</button>`);document.getElementById('saveTech').onclick=()=>{p.location=document.getElementById('tLocation').value;p.status=document.getElementById('tStatus').value;save();closeModal();render();showToast('Tech status updated');}; }

  function openIssue(id){ const i=id?state.issues.find(x=>x.id===id):{id:'i'+Date.now(),booth:'C.P. Bourg',title:'',details:'',assignedTo:'',status:'Open'};const techNames=['Unassigned',...state.people.filter(p=>p.group==='Technical').map(p=>p.name)];openModal(id?'Technical issue':'Report equipment issue',`<div class="form-grid">${selectField('iBooth','Booth',['C.P. Bourg','Canon','Xerox'],i.booth)}${field('iTitle','Issue',i.title)}<div class="field"><label for="iDetails">Details</label><textarea id="iDetails" class="textarea">${esc(i.details)}</textarea></div>${selectField('iTech','Assigned technician',techNames,i.assignedTo||'Unassigned')}${selectField('iStatus','Status',['Open','Responding','Monitoring','Resolved'],i.status)}</div>`,`<button class="ghost-btn" value="cancel">Cancel</button><button id="saveIssue" type="button" class="primary-btn">Save</button>`);document.getElementById('saveIssue').onclick=()=>{i.booth=document.getElementById('iBooth').value;i.title=document.getElementById('iTitle').value.trim()||'Equipment issue';i.details=document.getElementById('iDetails').value.trim();const tech=document.getElementById('iTech').value;i.assignedTo=tech==='Unassigned'?'':tech;i.status=document.getElementById('iStatus').value;if(!id)state.issues.push(i);save();closeModal();render();showToast('Issue saved');}; }

  function openCoverageRequest(loc){ openModal('Need coverage',`<div class="form-grid">${selectField('cLoc','Booth',['C.P. Bourg','Canon','Xerox'],loc)}${field('cNote','Note','Need sales coverage')}</div>`,`<button class="ghost-btn" value="cancel">Cancel</button><button id="sendCoverage" type="button" class="primary-btn">Create request</button>`);document.getElementById('sendCoverage').onclick=()=>{const booth=document.getElementById('cLoc').value;const note=document.getElementById('cNote').value.trim();state.coverageRequests.push({id:'c'+Date.now(),day:state.selectedDay,booth,note,createdBy:state.currentUserId,status:'Open'});save();closeModal();showToast(`Coverage request created for ${booth}`);}; }

  function openRide(id){ const r=id?state.rides.find(x=>x.id===id):{id:'r'+Date.now(),day:state.selectedDay,time:'07:45',from:'Hotel',to:'LVCC',note:'Team rideshare',joined:[]};openModal(id?'Edit ride':'Add ride',`<div class="form-grid">${field('rTime','Time',r.time,'time')}${field('rFrom','From',r.from)}${field('rTo','To',r.to)}${field('rNote','Note',r.note)}</div>`,`<button class="ghost-btn" value="cancel">Cancel</button><button id="saveRide" type="button" class="primary-btn">Save</button>`);document.getElementById('saveRide').onclick=()=>{r.time=document.getElementById('rTime').value;r.from=document.getElementById('rFrom').value.trim();r.to=document.getElementById('rTo').value.trim();r.note=document.getElementById('rNote').value.trim();if(!id)state.rides.push(r);save();closeModal();render();showToast('Ride saved');}; }
  function toggleRide(id){ const r=state.rides.find(x=>x.id===id);if(!r)return;const ix=r.joined.indexOf(state.currentUserId);if(ix>=0)r.joined.splice(ix,1);else r.joined.push(state.currentUserId);save();render();showToast(ix>=0?'Left ride':'Joined ride'); }

  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{state.selectedView=b.dataset.view;save();render();window.scrollTo({top:0,behavior:'smooth'});}));
  modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').hidden=false;});
  document.getElementById('installBtn').addEventListener('click',async()=>{if(!installPrompt){showToast('Use your browser menu → Add to Home screen');return;}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').hidden=true;});
  if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
  function minutesUntil(t){ const [h,m]=t.split(':').map(Number); const d=new Date(); return (h*60+m)-(d.getHours()*60+d.getMinutes()); }
  function reminderTick(){ if(todayKey()!==state.selectedDay)return; const me=person(state.currentUserId); if(!me)return; const upcoming=[...(state.assignments[state.selectedDay]||[]).filter(a=>a.personId===me.id).map(a=>({id:'a'+a.id,time:a.start,text:`${a.location}${locationCode(a.location)?' '+locationCode(a.location):''} — ${a.activity}`})),...dayAppointments().filter(a=>(a.ownerIds||[]).includes(me.id)).map(a=>({id:'p'+a.id,time:a.time,text:`${a.company} — ${a.location}`}))]; upcoming.forEach(x=>{const min=minutesUntil(x.time);const key=`bourg-reminded-${state.selectedDay}-${x.id}`;if(min>=0&&min<=state.reminderMinutes&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');const text=`In ${min} min: ${x.text}`;showToast(text);if('Notification' in window&&Notification.permission==='granted'){try{new Notification('C.P. Bourg Expo Ops',{body:text});}catch{}}}}); }
  setInterval(reminderTick,60000); setTimeout(reminderTick,1200);

  window.BourgOps={
    getState:()=>clone(state),
    replaceState:(next)=>{ state=normalizeState(next); localStorage.setItem(KEY,JSON.stringify(state)); updateIssueBadge(); render(); },
    setCurrentUserId:(id)=>{ if(id&&state.people.some(p=>p.id===id)){ state.currentUserId=id; localStorage.setItem(KEY,JSON.stringify(state)); render(); } },
    showToast
  };
  updateIssueBadge(); render();
})();

  </script>

  <script src="push.js?v=1"></script>
  <script src="chat.js?v=5"></script>
  <script src="sync.js?v=6"></script>
